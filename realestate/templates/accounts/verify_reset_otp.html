{% extends 'base.html' %}

{% block content %}

<section class="our-log bgc-fa py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">

```
            <div class="login_form inner_page p-4 shadow rounded bg-white">

                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} text-center">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- OTP Display (ONLY FOR TESTING) -->
                {% if otp %}
                    <div class="alert alert-success text-center">
                        Your OTP: <strong>{{ otp }}</strong>
                    </div>
                {% endif %}

                <!-- Heading -->
                <div class="heading text-center mb-4">
                    <h3>Verify OTP</h3>
                    <p class="text-muted">
                        Enter the OTP sent to your email
                    </p>
                </div>

                <!-- Form -->
                <form method="post">
                    {% csrf_token %}

                    <div class="form-group mb-3">
                        <label for="otp">OTP Code</label>
                        <input 
                            type="text" 
                            id="otp"
                            name="otp" 
                            class="form-control" 
                            placeholder="Enter OTP" 
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-thm2 btn-block w-100">
                        Verify OTP
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>
```

</section>

{% endblock %}
