{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Manage Cities</h2>

<div class="row">
    <div class="col-md-6">
        <h5>Add New City</h5>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Add City</button>
        </form>
    </div>
</div>

<hr>
<h5>Existing Cities</h5>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for city in cities %}
        <tr>
            <td>{{ city.id }}</td>
            <td>{{ city.name }}</td>
            <td>
                <a href="{% url 'admin_dashboard:edit_city' city.id %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'admin_dashboard:delete_city' city.id %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">No cities found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
